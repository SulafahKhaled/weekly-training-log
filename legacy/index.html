<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>الخطة الأسبوعية — Weekly Training Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12141a;
  --bg-raised:#1a1d26;
  --bg-card:#1e222c;
  --line:#2a2f3b;
  --text:#eef0f4;
  --text-dim:#9aa2b1;
  --text-faint:#5f6675;

  --upper:#7c93ff;
  --upper-dim:#2a3050;
  --lower:#49d6ac;
  --lower-dim:#123a30;
  --core:#f5ac3c;
  --core-dim:#3d2c11;
  --hiit:#ff6b5e;
  --hiit-dim:#3c1c19;

  --radius:14px;
  --radius-sm:8px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
  padding-bottom:60px;
}
.ar{font-family:'Tajawal','Inter',sans-serif;direction:rtl;unicode-bidi:isolate;}

h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}

button{font-family:inherit;}

/* ===== Top bar ===== */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(18,20,26,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:14px 18px;
  display:flex;align-items:center;gap:10px;
}
.topbar .back{
  background:none;border:none;color:var(--text-dim);
  font-size:22px;line-height:1;cursor:pointer;padding:4px 8px 4px 0;
  display:none;
}
.topbar .back.show{display:block;}
.topbar .title-wrap{flex:1;min-width:0;}
.topbar h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .sub{font-size:12px;color:var(--text-faint);margin-top:1px;}

/* ===== Bottom nav ===== */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:rgba(18,20,26,.96);
  backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tabbar button{
  flex:1;background:none;border:none;color:var(--text-faint);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;padding:6px 2px;cursor:pointer;border-radius:10px;
}
.tabbar button .ic{font-size:18px;}
.tabbar button.active{color:var(--upper);}

main{padding:16px 16px 24px;max-width:640px;margin:0 auto;}
.view{display:none;animation:fade .25s ease;}
.view.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* ===== Home ===== */
.hero{
  padding:22px 4px 18px;
}
.hero .kicker{color:var(--text-faint);font-size:12.5px;font-weight:600;letter-spacing:.5px;}
.hero h1{font-size:26px;margin:6px 0 4px;font-weight:700;}
.hero p{color:var(--text-dim);font-size:14px;margin:0;line-height:1.5;}

.legend{display:flex;gap:14px;flex-wrap:wrap;margin:16px 4px 4px;}
.legend .item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);}
.legend .dot{width:9px;height:9px;border-radius:50%;}

.day-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px;}
.day-card{
  background:var(--bg-card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  display:flex;align-items:center;gap:14px;
  cursor:pointer;
  transition:transform .12s ease, border-color .12s ease;
  text-align:left;
}
.day-card:active{transform:scale(.98);}
.day-card .daynum{
  width:46px;height:46px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;
  flex-shrink:0;
}
.day-card .info{flex:1;min-width:0;}
.day-card .dayname{font-weight:600;font-size:15px;}
.day-card .dayname .ar{font-size:13px;color:var(--text-dim);display:block;margin-top:1px;}
.day-card .tag{
  display:inline-block;margin-top:6px;font-size:11px;font-weight:600;
  padding:3px 9px;border-radius:20px;
}
.day-card .chev{color:var(--text-faint);font-size:18px;}
.day-card .progress-pill{font-size:11px;color:var(--text-faint);margin-top:6px;}

.quicklinks{display:flex;gap:8px;margin-top:18px;}
.quicklinks button{
  flex:1;background:var(--bg-raised);border:1px solid var(--line);color:var(--text-dim);
  border-radius:10px;padding:10px 6px;font-size:12px;font-weight:600;cursor:pointer;
}

/* ===== Day view ===== */
.day-hero{
  border-radius:var(--radius);
  padding:18px 16px;
  margin-bottom:16px;
  border:1px solid var(--line);
}
.day-hero .tag{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;margin-bottom:8px;}
.day-hero h2{margin:0 0 2px;font-size:20px;}
.day-hero .ar{color:var(--text-dim);font-size:14px;}
.day-hero .reset{
  margin-top:12px;background:none;border:1px solid var(--line);color:var(--text-faint);
  font-size:11.5px;padding:6px 10px;border-radius:8px;cursor:pointer;
}

.section-label{
  font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:var(--text-faint);margin:22px 4px 10px;display:flex;align-items:center;gap:8px;
}
.section-label .line{flex:1;height:1px;background:var(--line);}

/* Exercise card */
.ex-card{
  background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:10px;overflow:hidden;
}
.ex-head{
  display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;
}
.ex-head .checkmark{
  width:24px;height:24px;border-radius:50%;border:1.5px solid var(--text-faint);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;
  transition:all .15s ease;
}
.ex-head .checkmark.done{background:var(--lower);border-color:var(--lower);color:#0a1c16;}
.ex-head .names{flex:1;min-width:0;}
.ex-head .en{font-weight:600;font-size:14.5px;}
.ex-head .arname{font-size:12.5px;color:var(--text-dim);margin-top:1px;}
.ex-head .meta{font-size:11.5px;color:var(--text-faint);margin-top:3px;}
.ex-head .expand-ic{color:var(--text-faint);font-size:13px;transition:transform .2s ease;flex-shrink:0;}
.ex-card.open .expand-ic{transform:rotate(180deg);}

.ex-body{display:none;padding:0 14px 16px;border-top:1px solid var(--line);}
.ex-card.open .ex-body{display:block;padding-top:14px;}

/* video */
.video-wrap{
  position:relative;border-radius:10px;overflow:hidden;background:#000;
  aspect-ratio:16/9;margin-bottom:14px;
}
.video-wrap img{width:100%;height:100%;object-fit:cover;display:block;opacity:.75;}
.video-wrap iframe{width:100%;height:100%;border:0;display:block;}
.video-wrap .playbtn{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  cursor:pointer;background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.45));
}
.video-wrap .playbtn .circle{
  width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.92);
  display:flex;align-items:center;justify-content:center;
}
.video-wrap .playbtn .circle svg{margin-left:3px;}
.video-wrap .yt-label{
  position:absolute;bottom:8px;left:8px;font-size:10.5px;background:rgba(0,0,0,.55);
  padding:3px 8px;border-radius:6px;color:#fff;
}

/* sets / reps list */
.set-row{
  display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);
}
.set-row:last-child{border-bottom:none;}
.set-row .setbox{
  width:26px;height:26px;border-radius:7px;border:1.5px solid var(--text-faint);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--text-faint);cursor:pointer;font-weight:600;
}
.set-row .setbox.done{background:var(--upper);border-color:var(--upper);color:#0c1030;}
.set-row .setlabel{font-size:13.5px;color:var(--text-dim);flex:1;}
.set-row .resttimer{font-size:11.5px;color:var(--text-faint);}

.hint{font-size:12px;color:var(--text-faint);margin:10px 0 4px;line-height:1.5;}

/* Timer panel (isometric / circuit) */
.timerbox{
  background:var(--bg-raised);border-radius:12px;padding:16px;text-align:center;margin-bottom:12px;
}
.timerbox .phase{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-faint);margin-bottom:6px;}
.timerbox .big{font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:700;line-height:1;margin-bottom:6px;}
.timerbox .cur-ex{font-size:13.5px;color:var(--text-dim);min-height:18px;}
.timerbox .progress-txt{font-size:11.5px;color:var(--text-faint);margin-top:4px;}
.timerbox .controls{display:flex;gap:8px;justify-content:center;margin-top:14px;}
.timerbox .controls button{
  border:none;border-radius:9px;padding:10px 18px;font-size:13.5px;font-weight:600;cursor:pointer;
}
.btn-start{background:var(--upper);color:#0c1030;}
.btn-pause{background:var(--bg-card);border:1px solid var(--line) !important;color:var(--text);}
.btn-reset{background:none;border:1px solid var(--line) !important;color:var(--text-faint);}

/* Info pages (warmup/cooldown/mobility) */
.info-hero{margin-bottom:18px;}
.info-hero h2{font-size:20px;margin:0 0 6px;}
.info-hero p{color:var(--text-dim);font-size:13.5px;line-height:1.6;margin:0;}
.info-card{
  background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:14px;
}
.info-card h3{margin:0 0 3px;font-size:15px;}
.info-card .ar{font-size:12.5px;color:var(--text-dim);margin-bottom:10px;}
.info-card .tips{margin:10px 0 0;padding-left:18px;font-size:12.5px;color:var(--text-dim);line-height:1.7;}
.badge{
  display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;
  background:var(--bg-raised);color:var(--text-faint);border:1px solid var(--line);margin-bottom:8px;
}

footer.note{
  text-align:center;color:var(--text-faint);font-size:11px;margin-top:30px;line-height:1.6;
}
</style>
</head>
<body>

<div class="topbar">
  <button class="back" id="backBtn">‹</button>
  <div class="title-wrap">
    <h1 id="topTitle">الخطة الأسبوعية</h1>
    <div class="sub" id="topSub">Your 7-day training tracker</div>
  </div>
</div>

<main id="main"></main>

<div class="tabbar">
  <button data-tab="home" class="active"><span class="ic">🏠</span>Home</button>
  <button data-tab="warmup"><span class="ic">🔥</span>Warm-up</button>
  <button data-tab="mobility"><span class="ic">🤸</span>Mobility</button>
  <button data-tab="cooldown"><span class="ic">🧊</span>Cool-down</button>
</div>

<script src="app.js"></script>
</body>
</html>
